[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PySide6-Fluent-Widgets-Qiao"
version = "2.0.15"
description = "A fluent design widgets library based on PySide6"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "AQiaoYo", email = "AQiaoYo@qq.com" }]
maintainers = [{ name = "AQiaoYo", email = "AQiaoYo@qq.com" }]
keywords = ["pyside6", "fluent", "widgets"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "PySide6>=6.4.2",
    "PySideSix-Frameless-Window>=0.8.0",
    "darkdetect",
]

[project.optional-dependencies]
full = ["colorthief", "pillow", "scipy"]

[project.scripts]
preview = "devtools.preview:main"

[project.urls]
Documentation = "https://github.com/AQiaoYo/PySide6-Fluent-Widgets#readme"
Source = "https://github.com/AQiaoYo/PySide6-Fluent-Widgets"
Issues = "https://github.com/AQiaoYo/PySide6-Fluent-Widgets/issues"

[dependency-groups]
docs = [
    "commonmark==0.9.1",
    "furo",
    "mock==1.0.1",
    "recommonmark==0.5.0",
    "sphinx-autoapi",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-intl",
    "sphinx-markdown-tables==0.0.17",
    "urllib3<2.0.0",
]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["qfluentwidgets*", "devtools*"]

[tool.uv]
package = true
